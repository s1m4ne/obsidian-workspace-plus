name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 24 runs the TypeScript test suite directly through native type
      # stripping, so tests need no transpile step.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # One command, thirteen gates, and deliberately not a hand-picked subset.
      #
      # This job used to run five of them - typecheck, the lint ratchet, tests,
      # i18n and build - which left out every gate that exists *because* this
      # repository produced the same failure eight times with all the others
      # green: reachability, unwired hooks, host conformance, delegation,
      # read-only writes, dual dispatch, import extensions and the coverage
      # ratchet. Each of those was added after a specific defect shipped, and
      # none of them ran here.
      #
      # `npm run check` is what a commit has to pass locally, so it is what CI
      # has to pass too; anything else lets the two disagree about what "green"
      # means.
      - name: Gate (typecheck, lint, 9 checks, tests, coverage, build)
        run: npm run check
